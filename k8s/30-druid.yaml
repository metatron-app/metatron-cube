#
# Druid roles. Replace nas2.s2dev.net:5050/adp/metatron-cube:2021.3 with your pushed image.
#
# Inter-node discovery is via ZooKeeper, where each node announces druid.host:port.
# druid.host is set to the pod IP (-Ddruid.host=$(POD_IP)) so peers reach it on the
# flat pod network. Peons forked by the middleManager auto-detect their pod IP.
#
# Credentials: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY come from the
# swd-iceberg-credentials Secret (already present in the adp-dev namespace).
#
# ----------------------------------------------------------------------------- coordinator
apiVersion: v1
kind: Service
metadata: { name: coordinator, namespace: adp-dev, labels: { app: druid, role: coordinator } }
spec:
  selector: { app: druid, role: coordinator }
  ports: [ { name: http, port: 8081, targetPort: 8081 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: coordinator, namespace: adp-dev }
spec:
  replicas: 1
  selector: { matchLabels: { app: druid, role: coordinator } }
  template:
    metadata: { labels: { app: druid, role: coordinator } }
    spec:
      securityContext: { fsGroup: 999 }
      containers:
        - name: druid
          image: nas2.s2dev.net:5050/adp/metatron-cube:2021.3
          imagePullPolicy: Always
          args: ["coordinator"]
          # coordinator Xmx 512m + embedded overlord forks local peons (Xmx 512m each) -> leave headroom.
          resources:
            requests: { cpu: "500m", memory: "1536Mi" }
            limits:   { cpu: "2",    memory: "3Gi" }
          env:
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
            - { name: DRUID_JAVA_OPTS, value: "-Ddruid.host=$(POD_IP)" }
            - { name: AWS_ACCESS_KEY_ID, valueFrom: { secretKeyRef: { name: swd-iceberg-credentials, key: s3-access-key } } }
            - { name: AWS_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: swd-iceberg-credentials, key: s3-secret-key } } }
          ports: [ { containerPort: 8081 } ]
          volumeMounts:
            - { name: common-conf, mountPath: /opt/druid/conf/druid/_common }
            - { name: role-conf,   mountPath: /opt/druid/conf/druid/coordinator }
            - { name: var,         mountPath: /opt/druid/var }
          readinessProbe: { httpGet: { path: /status/health, port: 8081 }, initialDelaySeconds: 45, periodSeconds: 10, failureThreshold: 30 }
          livenessProbe:  { httpGet: { path: /status/health, port: 8081 }, initialDelaySeconds: 90, periodSeconds: 15, failureThreshold: 6 }
      volumes:
        - { name: common-conf, configMap: { name: druid-common } }
        - { name: role-conf,   configMap: { name: druid-coordinator } }
        - { name: var,         emptyDir: {} }
# (no overlord deployment: the coordinator runs it embedded — asOverlord — and serves
#  the overlord API on :8081/druid/indexer/*. No middleManager either: the embedded
#  overlord uses the forking task runner. See k8s/10-config.yaml druid-coordinator.)
# ----------------------------------------------------------------------------- broker
---
apiVersion: v1
kind: Service
metadata: { name: broker, namespace: adp-dev, labels: { app: druid, role: broker } }
spec:
  selector: { app: druid, role: broker }
  ports: [ { name: http, port: 8082, targetPort: 8082 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: broker, namespace: adp-dev }
spec:
  replicas: 1
  selector: { matchLabels: { app: druid, role: broker } }
  template:
    metadata: { labels: { app: druid, role: broker } }
    spec:
      securityContext: { fsGroup: 999 }
      containers:
        - name: druid
          image: nas2.s2dev.net:5050/adp/metatron-cube:2021.3
          imagePullPolicy: Always
          args: ["broker"]
          # Xmx 1g + direct 1g (processing/merge buffers) + result-merge heap + overhead.
          resources:
            requests: { cpu: "500m", memory: "2Gi" }
            limits:   { cpu: "2",    memory: "3Gi" }
          env:
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
            - { name: DRUID_JAVA_OPTS, value: "-Ddruid.host=$(POD_IP)" }
            - { name: AWS_ACCESS_KEY_ID, valueFrom: { secretKeyRef: { name: swd-iceberg-credentials, key: s3-access-key } } }
            - { name: AWS_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: swd-iceberg-credentials, key: s3-secret-key } } }
          ports: [ { containerPort: 8082 } ]
          volumeMounts:
            - { name: common-conf, mountPath: /opt/druid/conf/druid/_common }
            - { name: role-conf,   mountPath: /opt/druid/conf/druid/broker }
            - { name: var,         mountPath: /opt/druid/var }
          readinessProbe: { httpGet: { path: /status/health, port: 8082 }, initialDelaySeconds: 45, periodSeconds: 10, failureThreshold: 30 }
          livenessProbe:  { httpGet: { path: /status/health, port: 8082 }, initialDelaySeconds: 90, periodSeconds: 15, failureThreshold: 6 }
      volumes:
        - { name: common-conf, configMap: { name: druid-common } }
        - { name: role-conf,   configMap: { name: druid-broker } }
        - { name: var,         emptyDir: {} }
# ----------------------------------------------------------------------------- historical
---
apiVersion: v1
kind: Service
metadata: { name: historical, namespace: adp-dev, labels: { app: druid, role: historical } }
spec:
  clusterIP: None
  selector: { app: druid, role: historical }
  ports: [ { name: http, port: 8083, targetPort: 8083 } ]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: historical, namespace: adp-dev }
spec:
  serviceName: historical
  replicas: 1
  selector: { matchLabels: { app: druid, role: historical } }
  template:
    metadata: { labels: { app: druid, role: historical } }
    spec:
      securityContext: { fsGroup: 999 }
      containers:
        - name: druid
          image: nas2.s2dev.net:5050/adp/metatron-cube:2021.3
          imagePullPolicy: Always
          args: ["historical"]
          # mem = Xmx 1g + direct 1g + segment mmap (page cache) + overhead. cpu bursts above
          # numThreads(2) for http/merge/GC. Raise these if you bump processing.numThreads.
          resources:
            requests: { cpu: "1", memory: "3Gi" }
            limits:   { cpu: "4", memory: "5Gi" }
          env:
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
            - { name: DRUID_JAVA_OPTS, value: "-Ddruid.host=$(POD_IP)" }
            - { name: AWS_ACCESS_KEY_ID, valueFrom: { secretKeyRef: { name: swd-iceberg-credentials, key: s3-access-key } } }
            - { name: AWS_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: swd-iceberg-credentials, key: s3-secret-key } } }
          ports: [ { containerPort: 8083 } ]
          volumeMounts:
            - { name: common-conf, mountPath: /opt/druid/conf/druid/_common }
            - { name: role-conf,   mountPath: /opt/druid/conf/druid/historical }
            - { name: var,         mountPath: /opt/druid/var }
          readinessProbe: { httpGet: { path: /status/health, port: 8083 }, initialDelaySeconds: 45, periodSeconds: 10, failureThreshold: 30 }
          livenessProbe:  { httpGet: { path: /status/health, port: 8083 }, initialDelaySeconds: 90, periodSeconds: 15, failureThreshold: 6 }
      volumes:
        - { name: common-conf, configMap: { name: druid-common } }
        - { name: role-conf,   configMap: { name: druid-historical } }
  volumeClaimTemplates:
    - metadata: { name: var }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 20Gi } }   # segment cache (maxSize 10Gi in config)
# (no middleManager: the embedded overlord forks peons in the coordinator process.
#  To distribute tasks instead, set druid.indexer.runner.type=remote in the coordinator
#  config and add a middleManager StatefulSet here.)
