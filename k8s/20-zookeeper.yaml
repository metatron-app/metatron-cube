apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: metatron
  labels: { app: zookeeper }
spec:
  # Headless: stable DNS for the StatefulSet pod (zookeeper-0.zookeeper).
  clusterIP: None
  selector: { app: zookeeper }
  ports:
    - { name: client, port: 2181, targetPort: 2181 }
    - { name: peer, port: 2888, targetPort: 2888 }
    - { name: leader, port: 3888, targetPort: 3888 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: metatron
spec:
  serviceName: zookeeper
  replicas: 1
  selector: { matchLabels: { app: zookeeper } }
  template:
    metadata:
      labels: { app: zookeeper }
    spec:
      containers:
        - name: zookeeper
          image: zookeeper:3.9
          ports:
            - { name: client, containerPort: 2181 }
            - { name: peer, containerPort: 2888 }
            - { name: leader, containerPort: 3888 }
          env:
            - { name: ZOO_4LW_COMMANDS_WHITELIST, value: "ruok,stat,conf,mntr" }
            - { name: ZOO_STANDALONE_ENABLED, value: "true" }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: datalog, mountPath: /datalog }
          readinessProbe:
            exec: { command: ["sh", "-c", "echo ruok | nc -w 2 localhost 2181 | grep -q imok"] }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 2181 }
            initialDelaySeconds: 20
            periodSeconds: 15
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 2Gi } }
    - metadata: { name: datalog }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 2Gi } }
