#
# Docker-compose demo config (shared by all roles via the classpath _common dir).
# Edit this file to point at your real DB / ZooKeeper / deep storage.
#

#
# Extensions
#
# postgresql-metadata-storage bundles the (BSD-licensed) Postgres JDBC driver,
# so it works out of the box — unlike mysql-metadata-storage, which needs the
# GPL MySQL connector added manually.
# NOTE: lucene is temporarily omitted. In this fork lucene-common depends on
# druid-geometry-extensions, which is hadoop-dependent (GeoJsonFormatter uses
# hadoop FileSystem). Loading lucene therefore requires the hadoop-client bundle
# (the -h line we dropped from distribution/pom.xml). Re-enable lucene only after
# choosing a hadoop path (re-bundle hadoop-client, or patch out the coupling).
druid.extensions.loadList=["postgresql-metadata-storage", "druid-s3-extensions", "druid-kafka-indexing-service", "druid-histogram", "druid-datasketches", "druid-lookups-cached-global"]

#
# Logging
#
druid.startup.logging.logProperties=true

#
# Zookeeper (service name from docker-compose)
#
druid.zk.service.host=zookeeper
druid.zk.paths.base=/druid

#
# Metadata storage (PostgreSQL container)
#
druid.metadata.storage.type=postgresql
druid.metadata.storage.connector.connectURI=jdbc:postgresql://postgres:5432/druid
druid.metadata.storage.connector.user=druid
druid.metadata.storage.connector.password=diurd
# Coordinator/Overlord auto-create tables on first start.
druid.metadata.storage.connector.createTables=true

#
# Deep storage (shared local volume mounted at /opt/druid/var on every service)
#
druid.storage.type=local
druid.storage.storageDirectory=/opt/druid/var/segments

#
# Indexing service logs
#
druid.indexer.logs.type=file
druid.indexer.logs.directory=/opt/druid/var/indexing-logs

#
# Service discovery
#
druid.selectors.indexing.serviceName=druid/overlord
druid.selectors.coordinator.serviceName=druid/coordinator

#
# Monitoring / emitter
#
# JvmMonitor disabled: this fork's JvmMonitor uses sun.misc.Perf, removed in Java 9+
# (NoClassDefFoundError on Java 21). Re-enable after porting it (Phase 9).
druid.monitoring.monitors=[]
druid.emitter=logging
druid.emitter.logging.logLevel=info
druid.emitter.druidName=metatron
