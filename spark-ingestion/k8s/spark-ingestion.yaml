#
# Spec-driven Druid ingestion as a Spark job (spark-operator).
#
# Prereqs:
#  - Build the jar (online):  mvn -f spark-ingestion/pom.xml -DskipTests package
#    -> spark-ingestion/target/druid-spark-ingestion-2021.3-SNAPSHOT-spark.jar
#  - Bake that jar into your Spark image (with hadoop-aws for reading s3a parquet),
#    or point mainApplicationFile at it (s3a://, http://, local://).
#  - Copy the swd-iceberg-credentials secret into the adp-dev namespace.
#  - Druid (coordinator-as-overlord) reachable at coordinator.metatron.svc:8081.
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: druid-ingest-spec
  namespace: adp-dev
data:
  ingest-spec.json: |
    {
      "dataSource": "gdp_cred_iceberg",
      "source": {
        "type": "iceberg",
        "table": "iceberg.ato.gdp_credential_stealer_source_v2",
        "where": "timestamp >= timestamp '2024-05-20 00:00:00' AND timestamp < timestamp '2024-05-21 00:00:00'"
      },
      "timestampColumn": "timestamp",
      "dimensions": ["reference_type","stealer_root_path","source_sha256"],
      "metrics": [
        {"type":"count","name":"count"},
        {"type":"relay","name":"reference_url","columnName":"reference_url","typeName":"string"}
      ],
      "secondaryIndexing": {
        "reference_url": {
          "type": "lucene10",
          "strategies": [{"type":"text","fieldName":"reference_url"}]
        }
      },
      "segmentGranularity": "DAY",
      "queryGranularity": "NONE",
      "rollup": false,
      "numShards": 1,
      "bucket": "tmp-decompress",
      "baseKey": "druid/segments",
      "endpoint": "http://seaweed.s2dev.net:8333",
      "disableAcl": true,
      "publishUrl": "http://coordinator:8081/druid/indexer/v1/segments/publish"
    }
---
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: druid-ingestion
  namespace: adp-dev
spec:
  type: Java
  mode: cluster
  image: "nas2.s2dev.net:5050/adp/spark-druid-ingestion:3.5.1"     # spark 3.5.1 + hadoop-aws + the jar
  imagePullPolicy: Always
  mainClass: io.druid.segwriter.spark.SparkIngestion
  mainApplicationFile: "local:///opt/spark/jars/druid-spark-ingestion-spark.jar"
  arguments:
    - "/opt/spark/spec/ingest-spec.json"
  sparkVersion: "3.5.1"
  sparkConf:
    # --- Iceberg via the Polaris REST catalog (catalog name: "iceberg") ---
    # Polaris vends the S3 endpoint + keys in its config response, so we don't set s3.* here.
    # The OAuth2 credential (POLARIS_CLIENT_ID:SECRET) is injected programmatically from env by
    # SparkIngestion so it stays out of this manifest.
    "spark.sql.extensions": "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
    "spark.sql.catalog.iceberg": "org.apache.iceberg.spark.SparkCatalog"
    "spark.sql.catalog.iceberg.catalog-impl": "org.apache.iceberg.rest.RESTCatalog"
    "spark.sql.catalog.iceberg.uri": "http://polaris.adp.svc.cluster.local:8181/api/catalog"
    "spark.sql.catalog.iceberg.warehouse": "prod"
    "spark.sql.catalog.iceberg.scope": "PRINCIPAL_ROLE:ALL"
    "spark.sql.catalog.iceberg.header.Polaris-Realm": "adp-polaris"
    "spark.sql.catalog.iceberg.io-impl": "org.apache.iceberg.aws.s3.S3FileIO"
    # s3a (only used if reading raw parquet paths instead of an iceberg table)
    "spark.hadoop.fs.s3a.endpoint": "http://seaweed.s2dev.net:8333"
    "spark.hadoop.fs.s3a.path.style.access": "true"
    "spark.hadoop.fs.s3a.aws.credentials.provider": "com.amazonaws.auth.EnvironmentVariableCredentialsProvider"
    # Java 21 module opens for the Druid segment writer running inside the executors
    "spark.driver.extraJavaOptions": "--add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-exports=java.base/jdk.internal.ref=ALL-UNNAMED"
    "spark.executor.extraJavaOptions": "--add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-exports=java.base/jdk.internal.ref=ALL-UNNAMED"
  driver:
    cores: 1
    memory: "1g"
    serviceAccount: spark
    env:
      - name: AWS_ACCESS_KEY_ID
        valueFrom: { secretKeyRef: { name: swd-iceberg-credentials, key: s3-access-key } }
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom: { secretKeyRef: { name: swd-iceberg-credentials, key: s3-secret-key } }
      - name: POLARIS_CLIENT_ID
        valueFrom: { secretKeyRef: { name: swd-iceberg-credentials, key: polaris-client-id } }
      - name: POLARIS_CLIENT_SECRET
        valueFrom: { secretKeyRef: { name: swd-iceberg-credentials, key: polaris-client-secret } }
    volumeMounts:
      - { name: ingest-spec, mountPath: /opt/spark/spec }
  executor:
    instances: 2
    cores: 2
    memory: "2g"
    env:
      - name: AWS_ACCESS_KEY_ID
        valueFrom: { secretKeyRef: { name: swd-iceberg-credentials, key: s3-access-key } }
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom: { secretKeyRef: { name: swd-iceberg-credentials, key: s3-secret-key } }
      - name: POLARIS_CLIENT_ID
        valueFrom: { secretKeyRef: { name: swd-iceberg-credentials, key: polaris-client-id } }
      - name: POLARIS_CLIENT_SECRET
        valueFrom: { secretKeyRef: { name: swd-iceberg-credentials, key: polaris-client-secret } }
    volumeMounts:
      - { name: ingest-spec, mountPath: /opt/spark/spec }
  volumes:
    - name: ingest-spec
      configMap: { name: druid-ingest-spec }
  restartPolicy:
    type: Never
