#
# SparkRepackage: MOVE these datasources' s3_smoosh segments from tmp-decompress -> druid (destBucket), rebuilding
# the container at the destination and (deleteSource:true) deleting the entire source prefix afterwards. Sources
# here are already s3_smoosh (an earlier in-place transcode); the job also accepts s3_zip sources and transcodes
# them on the way. Safe for the normal cluster: it loads via the metadata DB, not the deep-storage descriptor.
#
# After this runs the segments live in bucket `druid` alongside atom_cred_smoosh, so a `standalone` historical
# pointed at {bucket: druid, dataSources: [...]} self-loads them. To convert IN PLACE instead, omit destBucket.
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: atom-repackage-spec
  namespace: adp-dev
data:
  repackage-spec.json: |
    {
      "dataSources": ["atom_credential", "gdp_cred_iceberg", "gdp_cred_lucene", "gdp_cred_test"],
      "bucket": "tmp-decompress",
      "baseKey": "druid/segments",
      "destBucket": "druid",
      "destBaseKey": "druid/segments",
      "endpoint": "http://seaweed.s2dev.net:8333",
      "disableAcl": true,
      "deleteSource": true
    }
---
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: atom-repackage-test
  namespace: adp-dev
spec:
  type: Java
  mode: cluster
  image: "nas2.s2dev.net:5050/adp/spark-druid-ingestion:3.5.1"
  imagePullPolicy: Always
  mainClass: io.druid.segwriter.spark.SparkRepackage
  mainApplicationFile: "local:///opt/spark/jars/druid-spark-ingestion-spark.jar"
  arguments:
    - "/opt/spark/spec/repackage-spec.json"
  sparkVersion: "3.5.1"
  sparkConf:
    "spark.driver.extraJavaOptions": "--add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-exports=java.base/jdk.internal.ref=ALL-UNNAMED"
    "spark.executor.extraJavaOptions": "--add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-exports=java.base/jdk.internal.ref=ALL-UNNAMED"
  driver:
    cores: 2
    memory: "4g"
    serviceAccount: spark
    env: &creds
      # druid-deepstore-credentials (svc-adp-druid) reaches BOTH tmp-decompress (read+delete source) and
      # druid (write dest), so a single key set covers the whole move.
      - name: AWS_ACCESS_KEY_ID
        valueFrom: { secretKeyRef: { name: druid-deepstore-credentials, key: s3-access-key } }
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom: { secretKeyRef: { name: druid-deepstore-credentials, key: s3-secret-key } }
    volumeMounts:
      - { name: repackage-spec, mountPath: /opt/spark/spec }
  executor:
    instances: 4                  # one task per segment; download+unzip+re-upload is I/O-bound
    cores: 2
    memory: "4g"
    env: *creds
    volumeMounts:
      - { name: repackage-spec, mountPath: /opt/spark/spec }
  volumes:
    - name: repackage-spec
      configMap: { name: atom-repackage-spec }
  restartPolicy:
    type: Never
